# /etc/nginx/sites-available/pos  (replace pos.example.com, then run certbot for HTTPS)
server {
    listen 80;
    server_name pos.example.com;
    client_max_body_size 5M;

    # React app (built with: cd frontend && npm run build)
    root /var/www/pos/frontend/dist;
    index index.html;
    location / { try_files $uri /index.html; }

    # Laravel API
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/pos/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Uploaded menu images
    location /storage/ { alias /var/www/pos/backend/storage/app/public/; expires 7d; }

    # Reverb websockets
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:8080;
    }
    location /apps { proxy_set_header Host $host; proxy_pass http://127.0.0.1:8080; }
}
